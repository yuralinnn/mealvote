<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e2622f">
<title>朋友約飯神器（預覽版）</title>
<meta name="description" content="三五好友各自填條件，自動配對雙北餐廳並投票決定。">
<style>
:root{
  --bg:#faf7f2; --card:#fff; --ink:#2a2724; --ink2:#6e675e; --ink3:#a09889;
  --line:#e9e2d6; --line2:#f2ece1;
  --brand:#e2622f; --brand-d:#c44f21; --brand-l:#fdefe7;
  --green:#2f9169; --green-l:#e6f3ed;
  --amber:#c8891c; --amber-l:#fdf3e0;
  --red:#c4483a; --red-l:#fbeae7;
  --sh:0 1px 2px rgba(42,39,36,.04), 0 6px 20px rgba(42,39,36,.06);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--ink);line-height:1.6;
  font-family:"PingFang TC","Microsoft JhengHei","Noto Sans TC",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased;font-size:16px;
}
.wrap{max-width:720px;margin:0 auto;padding:0 16px 96px}
button,input,select,textarea{font-family:inherit;font-size:inherit}
button{cursor:pointer;border:none;transition:.15s}
a{color:var(--brand)}
.hide{display:none !important}

/* ---------- header ---------- */
.top{padding:32px 0 20px;text-align:center}
.top .logo{font-size:34px;line-height:1}
.top h1{margin:8px 0 0;font-size:25px;font-weight:800;letter-spacing:-.4px}
.top p{margin:6px 0 0;color:var(--ink2);font-size:14.5px}

/* ---------- card ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:var(--sh);margin-bottom:14px}
.card h2{margin:0 0 3px;font-size:17px;font-weight:800}
.card .sub{margin:0 0 16px;color:var(--ink3);font-size:13.5px}

/* ---------- form ---------- */
.field{margin-bottom:18px}
.field > label{display:block;font-size:13px;font-weight:800;color:var(--ink2);margin-bottom:7px;letter-spacing:.3px}
.field .hint{font-size:12.5px;color:var(--ink3);font-weight:400;margin-left:6px}
input[type=text],input[type=date],input[type=time],input[type=number]{
  width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:11px;
  background:#fdfcfa;color:var(--ink);outline:none;transition:.15s
}
input:focus{border-color:var(--brand);background:#fff;box-shadow:0 0 0 3px var(--brand-l)}
.row{display:flex;gap:10px}
.row > *{flex:1;min-width:0}

.btn{padding:13px 20px;border-radius:12px;background:var(--brand);color:#fff;font-weight:800;font-size:15.5px;width:100%}
.btn:hover{background:var(--brand-d)}
.btn:disabled{background:#d9d2c6;cursor:not-allowed}
.btn.ghost{background:#fff;color:var(--ink2);border:1.5px solid var(--line)}
.btn.ghost:hover{background:#fdfcfa;border-color:var(--ink3);color:var(--ink)}
.btn.sm{padding:9px 15px;font-size:13.5px;width:auto;border-radius:10px}
.btn.green{background:var(--green)}
.btn.green:hover{filter:brightness(1.07)}

/* chips */
.opts{display:flex;flex-wrap:wrap;gap:7px}
.opt{padding:8px 13px;border-radius:999px;background:#fbf9f5;border:1.5px solid var(--line);font-size:14px;color:var(--ink2);font-weight:600}
.opt:hover{border-color:var(--brand);color:var(--brand)}
.opt.on{background:var(--brand);border-color:var(--brand);color:#fff}

/* segmented */
.seg{display:flex;background:#f4f0e8;border-radius:11px;padding:3px;gap:2px}
.seg button{flex:1;padding:9px 6px;border-radius:9px;background:transparent;font-size:14px;color:var(--ink2);font-weight:700}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.09)}

.linkbtn{margin-top:9px;background:none;color:var(--brand);font-size:13.5px;font-weight:700;padding:4px 0}
.linkbtn:hover{text-decoration:underline}
#linePicker{margin-top:11px;border:1px solid var(--line);border-radius:12px;padding:12px;background:#fdfcfa}
.lines{display:flex;flex-wrap:wrap;gap:6px}
.lines button{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:9px;
  background:#fff;border:1.5px solid var(--line);font-size:13px;font-weight:700;color:var(--ink2)}
.lines button:hover{border-color:var(--ink3);color:var(--ink)}
.lines button.on{border-color:currentColor}
.lines .dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.stops{display:flex;flex-wrap:wrap;gap:5px;margin-top:11px}
.stops:empty{margin-top:0}
.stops .seq{width:100%;font-size:12px;color:var(--ink3);margin-bottom:2px}
.stops button{padding:6px 11px;border-radius:8px;background:#fff;border:1px solid var(--line);
  font-size:13.5px;color:var(--ink2)}
.stops button:hover{border-color:var(--brand);color:var(--brand)}
.stationOK{margin-top:7px;font-size:13px;color:var(--green);font-weight:700}
.suggest{margin-top:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.suggest span{font-size:12.5px;color:var(--ink3)}
.suggest button{padding:5px 11px;border-radius:8px;background:#fff;border:1.5px solid var(--line);
  font-size:13.5px;color:var(--ink2);font-weight:600}
.suggest button:hover{border-color:var(--brand);color:var(--brand)}
.stationBad{margin-top:7px;font-size:13px;color:var(--red);font-weight:700}

/* ---------- room header ---------- */
.roombar{background:linear-gradient(135deg,#fff3ea,#fde9dc);border:1px solid #f5d9c6;border-radius:16px;padding:18px 20px;margin-bottom:14px}
.roombar .titlerow{display:flex;align-items:flex-start;gap:10px}
.roombar h2{margin:0;font-size:20px;font-weight:800;flex:1;min-width:0}
.editbtn{background:rgba(255,255,255,.7);border:1px solid #f0d3bd;color:#9a5c33;
  padding:4px 10px;border-radius:8px;font-size:12px;font-weight:700;flex-shrink:0}
.editbtn:hover{background:#fff}
#roomEdit .field{margin-bottom:10px}
#roomEdit label{display:block;font-size:12px;font-weight:800;color:#9a5c33;margin-bottom:5px}
#roomEdit input{background:#fff;border-color:#f0d3bd}
.roombar .when{margin:5px 0 0;color:#9a5c33;font-size:14.5px;font-weight:700}
.roombar .share{display:flex;gap:8px;margin-top:14px;align-items:center;flex-wrap:wrap}
.roombar code{background:#fff;border:1px solid #f0d3bd;padding:7px 13px;border-radius:9px;font-size:16px;font-weight:800;letter-spacing:2px;color:var(--brand-d)}

/* ---------- members ---------- */
.mlist{display:flex;flex-direction:column;gap:9px}
.m{display:flex;align-items:center;gap:11px;padding:11px 13px;border:1px solid var(--line);border-radius:12px;background:#fdfcfa}
.m.me{border-color:#f0c4a8;background:var(--brand-l)}
.av{width:34px;height:34px;border-radius:50%;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;flex-shrink:0}
.m .info{flex:1;min-width:0}
.m .info b{font-size:15px}
.m .info .d{font-size:12.5px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m .tag{font-size:11.5px;padding:3px 8px;border-radius:6px;background:var(--brand-l);color:var(--brand-d);font-weight:800;white-space:nowrap}

/* ---------- results ---------- */
.sec{margin-top:26px}
.sec-h{display:flex;align-items:baseline;gap:9px;margin-bottom:6px;flex-wrap:wrap}
.sec-h h3{margin:0;font-size:19px;font-weight:800}
.sec-h .cnt{font-size:12.5px;color:var(--ink3)}
.sec > p.lead{margin:0 0 14px;font-size:13.5px;color:var(--ink2)}

.r{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:16px 17px;box-shadow:var(--sh);margin-bottom:12px;position:relative}
.r.voted{border-color:var(--green);box-shadow:0 0 0 2px var(--green-l),var(--sh)}
.r.win{border-color:var(--amber);box-shadow:0 0 0 2px var(--amber-l),var(--sh)}
.r .rh{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.r h4{margin:0;font-size:17.5px;font-weight:800;letter-spacing:-.2px}
.r .why{font-size:12.5px;color:var(--brand-d);font-weight:800;margin-bottom:6px}
.r .meta{display:flex;gap:9px;flex-wrap:wrap;font-size:13px;color:var(--ink2);margin-top:6px;align-items:center}
.r .meta .dot{color:var(--ink3)}
.r .note{margin:9px 0 0;font-size:13.5px;color:var(--ink2)}
.rating{background:var(--amber-l);color:#8a5c11;padding:2px 8px;border-radius:6px;font-size:12.5px;font-weight:800}
.pill{padding:3px 9px;border-radius:7px;font-size:12px;font-weight:800;white-space:nowrap}
.pill.ok{background:var(--green-l);color:#1d6b4b}
.pill.warn{background:var(--amber-l);color:#8a5c11}
.pill.bad{background:var(--red-l);color:#96342a}
/* 想吃人數：人越多顏色越搶眼，一眼就看得出哪些是多數人的共識 */
.pill.v-all{background:var(--brand);color:#fff}
.pill.v4{background:#dcefe4;color:#1c6b46}
.pill.v3{background:var(--green-l);color:#1d6b4b}
.pill.v2{background:#e4eef7;color:#2a5f8a}
.pill.v1{background:#f2efe8;color:var(--ink3)}
.pill.soft{background:#f2efe8;color:var(--ink2)}
.pill.cheap{background:#e9f2e6;color:#3d6b2c}
.walk{color:var(--ink2);white-space:nowrap}
.src{padding:2px 7px;border-radius:6px;font-size:11px;font-weight:700;background:#f2efe8;color:var(--ink3);white-space:nowrap;cursor:help}

.who{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px;padding-top:11px;border-top:1px dashed var(--line)}
.who span{font-size:12.5px;padding:4px 9px;border-radius:7px;background:#f7f4ee;color:var(--ink2);font-weight:600}
.who span.bad{background:var(--red-l);color:#96342a}

.links{display:flex;gap:7px;margin-top:12px;flex-wrap:wrap}
.links a{flex:1;min-width:96px;text-align:center;padding:9px 6px;border-radius:10px;border:1.5px solid var(--line);color:var(--ink2);text-decoration:none;font-size:13px;font-weight:700;background:#fdfcfa}
.links a:hover{border-color:var(--brand);color:var(--brand)}

.votebar{display:flex;align-items:center;gap:10px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line2)}
.votebar .tally{flex:1;display:flex;align-items:center;gap:7px;min-width:0}
.votebar .num{font-size:20px;font-weight:800;color:var(--green)}
.votebar .names{font-size:12.5px;color:var(--ink3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vbtn{padding:9px 17px;border-radius:10px;background:#fff;border:1.5px solid var(--line);color:var(--ink2);font-weight:800;font-size:13.5px;flex-shrink:0}
.vbtn:hover{border-color:var(--green);color:var(--green)}
.vbtn.on{background:var(--green);border-color:var(--green);color:#fff}

.ref{display:flex;flex-wrap:wrap;align-items:baseline;gap:5px 10px;background:#fbf9f5;border:1px dashed var(--line);border-radius:12px;padding:12px 15px;margin-bottom:12px;font-size:13.5px}
.ref b{font-weight:800;color:var(--brand-d)}
.ref span{color:var(--ink2)}
.ref strong{color:var(--ink);font-weight:800}
.ref em{font-style:normal;color:var(--ink3);font-size:12.5px;width:100%}

/* ---------- misc ---------- */
.warnbox{background:var(--amber-l);border:1px solid #f0dcb8;border-radius:12px;padding:13px 15px;margin-bottom:12px;font-size:13.5px;color:#7d5410}
.warnbox b{display:block;margin-bottom:3px}
.warnbox ul{margin:0;padding-left:19px}
.err{background:var(--red-l);border:1px solid #f0c4bc;color:#96342a;border-radius:11px;padding:11px 14px;font-size:14px;margin-bottom:12px;font-weight:600}
.blank{text-align:center;padding:44px 20px;color:var(--ink3)}
.blank .big{font-size:40px;margin-bottom:8px}
.sticky{position:sticky;bottom:0;background:linear-gradient(to top,var(--bg) 68%,transparent);padding:16px 0 12px;margin-top:6px}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(80px);background:var(--ink);color:#fff;padding:11px 20px;border-radius:11px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:99;max-width:88vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
footer{text-align:center;color:var(--ink3);font-size:12px;padding:26px 0 0;line-height:1.7}

/* ---------- 票數排行 ---------- */
.board{background:linear-gradient(135deg,#fff8ec,#fdf0d9);border:1px solid #f0dcb8;border-radius:16px;padding:16px 18px;margin-bottom:14px}
.board-h{display:flex;justify-content:space-between;align-items:baseline;font-size:14px;font-weight:800;color:#8a5a13;margin-bottom:12px}
.board-h span{font-size:12.5px;font-weight:600;color:#a9843f}
.board .row{display:flex;align-items:center;gap:11px;padding:9px 0;border-top:1px solid #f2e2c6}
.board .row:first-of-type{border-top:none}
.board .medal{font-size:19px;width:24px;text-align:center;flex-shrink:0}
.board .info{flex:1;min-width:0}
.board .info b{display:block;font-size:15.5px;color:var(--ink);line-height:1.35}
.board .info .sub{display:block;font-size:12px;color:#a9843f;line-height:1.45;margin-bottom:5px}
.board .bar{display:block;height:5px;background:#f2e2c6;border-radius:3px;overflow:hidden}
.board .bar i{display:block;height:100%;background:var(--amber);border-radius:3px;transition:width .3s}
.board .row.lead .bar i{background:var(--brand)}
.board .cnt{font-size:20px;font-weight:800;color:#8a5a13;flex-shrink:0}
.board .cnt em{font-style:normal;font-size:11.5px;font-weight:700}
.board .more{font-size:12px;color:#a9843f;padding-top:9px;border-top:1px solid #f2e2c6}
.clearv{margin-top:11px;width:100%;background:#fff;border:1px solid #f0dcb8;color:#8a5a13;padding:8px;border-radius:9px;font-size:12.5px;font-weight:700}
.clearv:hover{background:#fffdf8}

@media(max-width:520px){
  .top h1{font-size:22px}
  .r h4{font-size:16.5px}
  .roombar h2{font-size:18px}
}


/* ==================== 角色玩法 ==================== */

/* 彈窗 */
.modal{position:fixed;inset:0;background:rgba(30,27,24,.62);display:none;align-items:center;
  justify-content:center;padding:22px;z-index:200;backdrop-filter:blur(3px)}
.modal.on{display:flex}
.mbox{background:var(--card);border-radius:20px;padding:28px 24px;max-width:360px;width:100%;
  text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.28);animation:pop .28s cubic-bezier(.2,1.2,.4,1)}
@keyframes pop{from{transform:scale(.86);opacity:0}to{transform:scale(1);opacity:1}}
.mtag{font-size:11.5px;font-weight:800;letter-spacing:2px;color:var(--ink3)}
.memoji{font-size:58px;line-height:1.1;margin:10px 0 2px}
.mbox h3{margin:0 0 10px;font-size:24px;font-weight:800}
.mpower{margin:0 0 10px;font-size:15px;font-weight:700;color:var(--brand-d);line-height:1.55}
.mdetail{margin:0 0 20px;font-size:13.5px;color:var(--ink2);line-height:1.7}
.mtagline{margin:0 0 12px;font-size:16px;color:var(--ink);font-weight:700;line-height:1.6}
.mrole.poison h3{color:var(--red)}

/* 我的角色小卡 */
.myrole{display:flex;align-items:center;gap:12px;background:#fff;border:1.5px dashed var(--brand);
  border-radius:14px;padding:13px 15px;margin-bottom:14px;cursor:pointer}
.myrole:hover{background:var(--brand-l)}
.myrole .e{font-size:28px;flex-shrink:0}
.myrole div{flex:1;min-width:0}
.myrole b{display:block;font-size:15px}
.myrole span{font-size:12.5px;color:var(--ink2);display:block;line-height:1.5}
.myrole .q{width:22px;height:22px;border-radius:50%;background:var(--brand-l);color:var(--brand-d);
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;flex-shrink:0}

/* 等待進度 */
.waiting{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.waiting span{font-size:12.5px;padding:4px 10px;border-radius:8px;background:#fff;
  border:1px solid #f0dcb8;color:#a9843f;font-weight:600}
.waiting span.done{background:var(--green-l);border-color:#c3e3d3;color:#1d6b4b}
.hidden-note{margin:0;font-size:12.5px;color:#a9843f;line-height:1.6}
.doneBox{background:var(--green-l);border:1px solid #c3e3d3;border-radius:14px;padding:14px 16px;margin-bottom:14px}
.doneBox b{display:block;font-size:15px;color:#1d6b4b;margin-bottom:3px}
.doneBox p{margin:0;font-size:13px;color:#3d7a5e}

/* 轉盤 */
.wheelbox{background:var(--card);border:1px solid var(--line);border-radius:16px;
  padding:20px;margin-bottom:14px;text-align:center;box-shadow:var(--sh)}
.wheelbox h3{margin:0 0 5px;font-size:17px;font-weight:800}
.wheelbox p{margin:0 0 16px;font-size:13.5px;color:var(--ink2);line-height:1.6}
.wheelwrap{position:relative;width:250px;height:250px;margin:0 auto 18px}
.pointer{position:absolute;top:-14px;left:50%;transform:translateX(-50%);font-size:26px;
  color:var(--brand);z-index:2;text-shadow:0 2px 4px rgba(0,0,0,.2)}
.wheel{width:100%;height:100%;border-radius:50%;position:relative;
  border:6px solid #fff;box-shadow:0 6px 22px rgba(0,0,0,.18)}
.wheel .wl{position:absolute;top:50%;left:50%;transform-origin:0 0;color:#fff;font-size:11px;
  font-weight:800;white-space:nowrap;text-shadow:0 1px 2px rgba(0,0,0,.45);pointer-events:none}

/* 魔法師 */
.wizbox{background:#f4f0f8;border:1px solid #ddd0e8;border-radius:16px;padding:18px;margin-bottom:14px}
.wizbox h3{margin:0 0 5px;font-size:16px;font-weight:800;color:#6b3f8f}
.wizbox p{margin:0 0 12px;font-size:13px;color:#7d6091;line-height:1.6}
.swaptags{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.swaptags span{background:#fff;border:1.5px solid #ddd0e8;padding:6px 12px;border-radius:9px;
  font-size:13.5px;font-weight:700;color:#6b3f8f}
.swaptags span.ph{border-style:dashed;color:#a992ba;font-weight:600}
.swaptags em{font-style:normal;color:#a07ec0;font-weight:800}

/* 選取狀態 */
.r.picked{border-color:var(--green);box-shadow:0 0 0 2px var(--green-l),var(--sh)}
.r.mystery{border-color:#c9a227;background:linear-gradient(135deg,#fffdf5,#fdf8e8)}
.pill.mys{background:#f5e6b8;color:#7a5c10}
.note.dim{color:var(--ink3);font-size:12.5px}
.pickbar{display:flex;gap:8px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line2)}
.pickbtn{flex:1;padding:11px;border-radius:10px;background:#fff;border:1.5px solid var(--line);
  color:var(--ink2);font-weight:800;font-size:14px}
.pickbtn:hover{border-color:var(--green);color:var(--green)}
.pickbtn.on{background:var(--green);border-color:var(--green);color:#fff}
.swapbtn{flex:0 0 auto;padding:11px 14px;border-radius:10px;background:#fff;border:1.5px solid #ddd0e8;
  color:#6b3f8f;font-weight:800;font-size:13.5px}
.swapbtn.on{background:#6b3f8f;border-color:#6b3f8f;color:#fff}

/* 揭曉 */
.board.reveal{background:linear-gradient(135deg,#fff4e3,#fde7cf);border-color:#f0cba8}
.rolelist{display:flex;flex-direction:column;gap:7px}
.rolelist span{font-size:13.5px;color:#8a5a13}
.rolelist b{font-size:16px}

/* 神秘店家揭曉 */
.unmask{font-size:12px;font-weight:700;color:#8a6a12;letter-spacing:.4px;margin-bottom:4px}
.unmaskbox{background:linear-gradient(135deg,#fffdf5,#fdf3d6);border:1px solid #e6cf8a;
  border-radius:14px;padding:16px 15px;margin-bottom:12px;text-align:center;color:#6d5310}
.unmaskbox b{display:block;font-size:13px;letter-spacing:.5px;margin-bottom:6px}
.unmaskbox .alias{margin:0;font-size:13px;color:#9a7c2a}
.unmaskbox .real{margin:2px 0 6px;font-size:21px;font-weight:800;color:#4d3a06;line-height:1.3}
.unmaskbox .sub{margin:2px 0;font-size:13px;color:#8a6a12}

/* 彩蛋的 10 秒視窗 */
.mycd{margin:14px 0 10px}
.mycd .num{font-size:30px;font-weight:800;color:#c8891c;font-variant-numeric:tabular-nums;

const ALIASES = {
  "臺北車站":"台北車站","北車":"台北車站","台北":"台北車站","主車站":"台北車站",

  "淡江":"淡江大學","景文":"景文科大"
};

/* ---------- 建圖 ---------- */
function buildGraph(){
  const adj = new Map();          // 站名 -> Map(鄰站 -> {cost, line})
  const stationLines = new Map(); // 站名 -> Set(路線 id)

  function ensure(s){ if(!adj.has(s)) adj.set(s, new Map()); return adj.get(s); }
  function link(a, b, cost, line){
    const A = ensure(a), B = ensure(b);
    if(!A.has(b) || A.get(b).cost > cost) A.set(b, {cost, line});
    if(!B.has(a) || B.get(a).cost > cost) B.set(a, {cost, line});
  }

  LINES.forEach(function(L){
    L.stations.forEach(function(s, i){
      ensure(s);
      if(!stationLines.has(s)) stationLines.set(s, new Set());
      stationLines.get(s).add(L.id);
      if(i > 0) link(L.stations[i-1], s, 1, L.id);
    });
  });

  WALK_LINKS.forEach(function(w){ link(w[0], w[1], w[2], "walk"); });

  return { adj, stationLines };
}

const GRAPH = buildGraph();

// 供比對用：全部站名（排序過，順序不具意義）
const ALL_STATIONS = Array.from(GRAPH.adj.keys()).sort();

// 供前端選單用：依路線分組，站序照官方路線圖由起點到終點
const STATIONS_BY_LINE = LINES.map(function(L){
  return { id: L.id, name: L.name, color: L.color, lrt: !!L.lrt, stations: L.stations.slice() };
});

function normalizeStation(name){
  if(!name) return null;
  let s = String(name).trim().replace(/[站臺]/g, function(m){ return m === "臺" ? "台" : ""; });
  if(GRAPH.adj.has(s)) return s;
  if(ALIASES[s]) return ALIASES[s];
  const raw = String(name).trim();
  if(GRAPH.adj.has(raw)) return raw;
  if(ALIASES[raw]) return ALIASES[raw];
  // 模糊比對：包含關係
  const hit = ALL_STATIONS.find(function(x){ return x.indexOf(s) >= 0 || s.indexOf(x) >= 0; });
  return hit || null;
}

/**
 * 最短路徑，字典序最佳化：先讓「站數」最少，站數相同時再挑「換乘次數」最少的走法。
 *
 * 這樣做是為了跟使用者填的「最遠可接受幾站」保持一致 —— 篩選與顯示用的
 * 是同一個數字，不會出現「明明有 4 站的走法卻顯示 5 站」這種矛盾。
 * 實作上把成本編碼成 站數 × STATION_WEIGHT + 換乘數，換乘只用來打平手。
 */
const STATION_WEIGHT = 100;
const _cache = new Map();

function distance(from, to){
  const a = normalizeStation(from), b = normalizeStation(to);
  if(!a || !b) return null;
  if(a === b) return { stations: 0, transfers: 0, path: [a] };

  const key = a + " " + b;
  if(_cache.has(key)) return _cache.get(key);

  const best = new Map();   // "站名|路線" -> 排序成本
  const meta = new Map();   // "站名|路線" -> {station, stations, transfers, prev}
  const visited = new Set();
  const pq = [];

  function push(station, line, cost, stations, transfers, prevKey){
    const k = station + "|" + line;
    if(best.has(k) && best.get(k) <= cost) return;
    best.set(k, cost);
    meta.set(k, { station: station, stations: stations, transfers: transfers, prev: prevKey });
    pq.push([cost, k, station, line]);
  }

  push(a, "*", 0, 0, 0, null);
  let goalKey = null;

  while(pq.length){
    pq.sort(function(x, y){ return x[0] - y[0]; });
    const cur = pq.shift();
    const cost = cur[0], k = cur[1], u = cur[2], line = cur[3];
    if(visited.has(k)) continue;
    visited.add(k);
    if(best.get(k) < cost) continue;
    if(u === b){ goalKey = k; break; }

    const nbrs = GRAPH.adj.get(u);
    if(!nbrs) continue;
    const m = meta.get(k);
    nbrs.forEach(function(info, v){
      const changed = (line !== "*" && info.line !== line);
      const nCost = cost + info.cost * STATION_WEIGHT + (changed ? 1 : 0);
      push(v, info.line, nCost, m.stations + info.cost, m.transfers + (changed ? 1 : 0), k);
    });
  }

  if(!goalKey){ _cache.set(key, null); return null; }

  const path = [];
  let k = goalKey;
  while(k){ const m = meta.get(k); path.unshift(m.station); k = m.prev; }

  const g = meta.get(goalKey);
  const res = { stations: g.stations, transfers: g.transfers, path: path };
  _cache.set(key, res);
  return res;
}

return { LINES: LINES, ALL_STATIONS: ALL_STATIONS, STATIONS_BY_LINE: STATIONS_BY_LINE, ALIASES: ALIASES, normalizeStation: normalizeStation, distance: distance };

 * 地圖與查詢連結都用「搜尋」而不是寫死網址，所以不會有連結失效的問題。
 * 關鍵字刻意放寬成「店名 站名」而不是「店名 捷運X站」——
 * 加上「捷運」「站」會把查詢綁太死，萬一店搬家或資料有誤就整個查不到東西。
 */
function mapUrl(name, station){
  return "https://www.google.com/maps/search/?api=1&query=" +
         encodeURIComponent(name + " " + station);
}
function bookUrl(name, station){
  return "https://www.google.com/search?q=" +
         encodeURIComponent(name + " " + station + " 訂位");
}
function menuUrl(name, station){
  return "https://www.google.com/search?q=" +
         encodeURIComponent(name + " " + station + " 菜單");
}

/**
 * 讀入 OSM 匯入的資料（如果有的話）。
 * 跑過 `node tools/import-osm.js` 才會有這個檔案，沒有就只用上面的精選清單。
 *
 * 寫成這樣是因為這支檔案也會被 build-preview.js 打包進瀏覽器，
 * 那邊沒有 fs，所以要能安全地退回空陣列。
 */
var _req = typeof require === "function" ? require : null;

function loadOsm(){
  // 預覽版：由 build-preview.js 事先把資料掛在 globalThis 上
  if(typeof globalThis !== "undefined" && globalThis.__OSM_DATA__){
    return globalThis.__OSM_DATA__.restaurants || [];
  }
  if(!_req) return [];
  try{
    const fs = _req("fs"), path = _req("path");
    const f = path.join(__dirname, "osm-restaurants.json");
    if(!fs.existsSync(f)) return [];
    const j = JSON.parse(fs.readFileSync(f, "utf8"));
    return j.restaurants || [];
  }catch(e){
    console.warn("[restaurants] 讀取 osm-restaurants.json 失敗：" + e.message);
    return [];
  }
}

function build(){
  const out = [];
  const seen = new Set();
  let n = 0;

  // 先把 OSM 資料建成索引。精選清單裡的店如果 OSM 也有，
  // 就把「離車站幾公尺」繼承過來 —— 那是從實際座標算的，比人工估準。
  const osmList = loadOsm();
  const osmByKey = new Map();
  osmList.forEach(function(r){ osmByKey.set(r.name + "@" + r.station, r); });

  function push(r){
    const key = r.name + "@" + r.station;
    if(seen.has(key)) return;          // 精選清單優先，OSM 重複的就跳過
    seen.add(key);
    const hit = osmByKey.get(key);
    out.push(Object.assign({ id: "r" + (++n) }, r, {
      dist: r.dist != null ? r.dist : (hit ? hit.dist : null),
      mapUrl: mapUrl(r.name, r.station),
      bookUrl: bookUrl(r.name, r.station),
      menuUrl: menuUrl(r.name, r.station)
    }));
  }

  CHAINS.forEach(function(c){
    c.stations.forEach(function(st){
      push({ name: c.name, type: c.type, price: c.price, station: st,
             note: c.note, chain: true, book: !!c.book, source: "curated" });
    });
  });

  INDIE.forEach(function(r){
    push({ name: r.name, type: r.type, price: r.price, station: r.station,
           note: r.note, chain: false, book: !!r.book, source: "curated" });
  });

  CHEAP_EATS.forEach(function(r){
    push({ name: r.name, type: r.type, price: r.price, station: r.station,
           note: r.note, chain: false, book: false, source: "curated" });
  });

  const curatedCount = out.length;

  osmList.forEach(function(r){
    if(!TYPES.some(function(t){ return t.id === r.type; })) return;
    push({ name: r.name, type: r.type, price: r.price || null, station: r.station,
           dist: r.dist, note: r.note, chain: !!r.chain, book: false, source: "osm" });
  });

  if(out.length > curatedCount){
    console.log("[restaurants] 精選 " + curatedCount + " 筆 + OSM " +
                (out.length - curatedCount) + " 筆 = 共 " + out.length + " 筆");
  }

  return out;
}

/**
 * 對單一餐廳，逐一評估每位成員是否吃得到。
 * 回傳每個人的站數、換乘、是否超出可接受站數、是不是他想吃的類型。
 */
function evaluate(restaurant, members){
  const per = members.map(function(m){
    const d = mrt.distance(m.station, restaurant.station);
    const stations = d ? d.stations : null;
    const transfers = d ? d.transfers : null;
    const okDist = stations !== null && stations <= m.maxStations;
    const okType = Array.isArray(m.types) && m.types.indexOf(restaurant.type) >= 0;
    return {
      memberId: m.id, name: m.name,
      stations: stations, transfers: transfers,
      okDist: okDist, okType: okType,
      over: stations === null ? null : Math.max(0, stations - m.maxStations)
    };
  });

  const dists = per.map(function(p){ return p.stations === null ? 999 : p.stations; });
  return {
    per: per,
    nDist:   per.filter(function(p){ return p.okDist; }).length,
    nType:   per.filter(function(p){ return p.okType; }).length,
    nAll:    per.filter(function(p){ return p.okDist; }).length,
    maxStations: Math.max.apply(null, dists),
    avgStations: dists.reduce(function(a,b){ return a+b; }, 0) / dists.length,
    totalStations: dists.reduce(function(a,b){ return a+b; }, 0)
  };
}

/** 同一個品牌只留最好的那家分店 */
function dedupeByName(list){
  const seen = new Set();
  return list.filter(function(x){
    if(seen.has(x.restaurant.name)) return false;
    seen.add(x.restaurant.name);
    return true;
  });
}

/**
 * 共識區的挑選：照排序走一遍，同時遵守「每種類型最多幾家」與「每一站最多幾家」，
 * 直到湊滿想要的數量為止。
 *
 * 不用「先 cap 類型再 cap 車站」串接，是因為那樣兩層會互相削減 —— 
 * 第一層留下的剛好集中在同一站，第二層砍完就湊不滿數量了。
 * 一次走完並邊走邊檢查，才能既分散又補滿。
 */
function pickDiverse(list, want, perType, perStation){
  const byType = {}, byStation = {};
  const out = [];
  for(let i = 0; i < list.length && out.length < want; i++){
    const x = list[i];
    const t = x.restaurant.type, st = x.restaurant.station;
    if((byType[t] || 0) >= perType) continue;
    if((byStation[st] || 0) >= perStation) continue;
    byType[t] = (byType[t] || 0) + 1;
    byStation[st] = (byStation[st] || 0) + 1;
    out.push(x);
  }
  return out;
}

/**
 * 排序原則（依序）：
 *  1. 幾個人在可接受的站數內 —— 多數決
 *  2. 走最遠的那個人要走幾站 —— 公平性，不要有人特別犧牲
 *  3. 全體平均站數
 *  4. 個人小店優先於連鎖店 —— 不然畫面上永遠是那幾個連鎖品牌
 *  5. 精選清單優先於 OSM —— 精選的有價位、特色說明與訂位提示，資訊完整得多
 *  6. 有寫價位的優先於沒寫的
 */
function rank(a, b){
  if(b.ev.nAll !== a.ev.nAll) return b.ev.nAll - a.ev.nAll;
  if(a.ev.maxStations !== b.ev.maxStations) return a.ev.maxStations - b.ev.maxStations;

  // 平均站數取整數再比。差 0.3 站在現實中感覺不出來，
  // 不該讓這種差距壓過「個人小店優先」——不然連鎖品牌分店多，
  // 總有一家剛好近一點點，畫面上就永遠是那幾個連鎖。
  const aAvg = Math.round(a.ev.avgStations), bAvg = Math.round(b.ev.avgStations);
  if(aAvg !== bAvg) return aAvg - bAvg;

  const ac = a.restaurant.chain ? 1 : 0, bc = b.restaurant.chain ? 1 : 0;
  if(ac !== bc) return ac - bc;

  const as = a.restaurant.source === "curated" ? 0 : 1;
  const bs = b.restaurant.source === "curated" ? 0 : 1;
  if(as !== bs) return as - bs;

  if(a.ev.avgStations !== b.ev.avgStations) return a.ev.avgStations - b.ev.avgStations;
  const ap = a.restaurant.price ? 0 : 1, bp = b.restaurant.price ? 0 : 1;
  if(ap !== bp) return ap - bp;
  return (a.restaurant.price || 9999) - (b.restaurant.price || 9999);
}

  for(let i = a.length - 1; i > 0; i--){

    const t = a[i]; a[i] = a[j]; a[j] = t;

      if(room.ballots[mf.id] && room.ballots[mf.id].submittedAt) throw new Error("你已經轉過了");
      var ids = candidateIds();
      if(!ids.length) throw new Error("沒有候選餐廳可以轉");
      var idx = Math.floor(Math.random() * ids.length);
      var bal3 = { picks:[ids[idx]], swap:null, wheelPick:ids[idx], submittedAt:Date.now(), poisoned:false };
      if(room.pendingPoison){ bal3.poisoned = true; room.pendingPoison = false; }
      room.ballots[mf.id] = bal3;
      maybeReveal();
      return { index:idx, total:ids.length, restaurantId:ids[idx], poisoned:bal3.poisoned, room:publicRoom() };
    }
    if(method === "POST" && /\/reveal$/.test(p)){
      if(room.stage !== "voting") throw new Error("現在不能結算");
      if(!Object.keys(room.ballots||{}).length) throw new Error("還沒有人投票");
      room.stage = "revealed";
      return publicRoom();
    }
    if(method === "POST" && /\/reopen$/.test(p)){
      resetGame();
      return publicRoom();
    }
    throw new Error("預覽版沒有實作這個 API：" + method + " " + p);
  }
})();

</script>
<script>
/* 朋友約飯神器 — 前端 */
(function(){
"use strict";

var META = null;          // 類型與站名清單
var ROOM = null;          // 目前房間狀態
var MY_ID = null;         // 我在這個房間的成員 id（公開）
var MY_SECRET = null;     // 我的私鑰，查自己的角色與送出投票才需要
var MY_ROLE = null;       // 我抽到的角色（只有我看得到）
var MY_BALLOT = null;     // 我送出的票
var PICKS = [];           // 還沒送出前，我勾選的餐廳
var SWAP = [];            // 魔法師指定要交換的兩家
var SEEN_ROLE = false, SEEN_MYSTERY = false;
var GAME_NONCE = null;    // 目前這一局的識別碼，換局了就要重新跳角色卡與彩蛋
var MYSTERY_WINDOW = 10;  // 彩蛋只給 10 秒決定，時間到就關門
var MYSTERY_TIMER = null;
var POLL = null;
var EDITING = false;

var sel = { dist: 6, types: [] };

/* ---------- 小工具 ---------- */
function $(id){ return document.getElementById(id); }
function esc(s){
  return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}
function toast(msg){
  var t = $("toast");
  t.textContent = msg; t.classList.add("on");
  clearTimeout(window.__tt);
  window.__tt = setTimeout(function(){ t.classList.remove("on"); }, 2200);
}
function showErr(msg){
  $("errBox").innerHTML = msg ? '<div class="err">' + esc(msg) + "</div>" : "";
  if(msg) window.scrollTo({ top: 0, behavior: "smooth" });
}

/* localStorage 可能被隱私模式擋掉，失敗就退回記憶體 */
var memStore = {};
function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return memStore[k] || null; } }
function lsSet(k, v){ try{ localStorage.setItem(k, v); }catch(e){ memStore[k] = v; } }

async function api(method, path, body){
  // 預覽版沒有伺服器，改由瀏覽器內的模擬後端回應（正式版不會進到這一行）
  if(window.__MOCK_API__) return window.__MOCK_API__(method, path, body);
  var res = await fetch("/api" + path, {
    method: method,
    headers: body ? { "Content-Type": "application/json" } : {},
    body: body ? JSON.stringify(body) : undefined
  });
  var json = await res.json().catch(function(){ return {}; });
  if(!res.ok) throw new Error(json.error || ("伺服器錯誤 " + res.status));
  return json;
}

function roomIdFromUrl(){
  var m = location.pathname.match(/^\/r\/([A-Z0-9]{4,8})/i);
  return m ? m[1].toUpperCase() : null;
}

/* ---------- 啟動 ---------- */
async function boot(){
  try{
    META = await api("GET", "/meta");
  }catch(e){
    showErr("載不到基本資料，請重新整理頁面");
    return;
  }

  $("statR").textContent = META.restaurantCount;
  $("statS").textContent = META.stations.length;
  $("fTypes").innerHTML = META.types.map(function(t){
    return '<button type="button" class="opt" data-t="' + t.id + '">' + t.emoji + " " + esc(t.label) + "</button>";
  }).join("");

  var d = new Date();
  $("hDate").value = d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");

  bindHome();
  bindForm();

  var rid = roomIdFromUrl();
  if(rid) await openRoom(rid);
}

/* ---------- 首頁 ---------- */
function bindHome(){
  $("btnCreate").onclick = async function(){
    var btn = this;
    btn.disabled = true;
    try{
      var room = await api("POST", "/rooms", {
        title: $("hTitle").value, date: $("hDate").value, time: $("hTime").value
      });
      history.pushState({}, "", "/r/" + room.id);
      await openRoom(room.id);
    }catch(e){ toast(e.message); }
    btn.disabled = false;
  };
  $("btnJoin").onclick = function(){
    var code = ($("hJoin").value || "").trim().toUpperCase();
    if(code.length < 4) return toast("房號長度不對");
    history.pushState({}, "", "/r/" + code);
    openRoom(code);
  };
  $("hJoin").addEventListener("keydown", function(e){ if(e.key === "Enter") $("btnJoin").click(); });
}

/* ---------- 表單 ---------- */
function bindForm(){
  $("fTypes").addEventListener("click", function(e){
    var b = e.target.closest(".opt"); if(!b) return;
    var t = b.dataset.t, i = sel.types.indexOf(t);
    if(i >= 0) sel.types.splice(i, 1);
    else{
      if(sel.types.length >= 8) return toast("最多選 8 種");
      sel.types.push(t);
    }
    b.classList.toggle("on");
  });

  function seg(id, key, after){
    $(id).addEventListener("click", function(e){
      var b = e.target.closest("button"); if(!b) return;
      this.querySelectorAll("button").forEach(function(x){ x.classList.remove("on"); });
      b.classList.add("on");
      sel[key] = parseInt(b.dataset.v, 10);
      if(after) after();
    });
  }
  seg("fDist", "dist");

  /* 沒有下拉選單了，所以打到一半要給得出可以直接點的建議 */
  $("fStation").addEventListener("input", function(){
    var v = this.value.trim();
    var box = $("stationMsg");
    if(!v){ box.className = ""; box.innerHTML = ""; return; }

    if(META.stations.indexOf(v) >= 0){
      box.className = "stationOK"; box.textContent = "✓ " + v + "站";
      return;
    }
    var near = META.stations.filter(function(s){ return s.indexOf(v) >= 0; }).slice(0, 6);
    if(near.length){
      box.className = "suggest";
      box.innerHTML = "<span>你是不是要找：</span>" + near.map(function(s){
        return '<button type="button" data-stop="' + esc(s) + '">' + esc(s) + "</button>";
      }).join("");
    }else{
      box.className = "stationBad";
      box.textContent = "找不到這一站，按下面「依路線選擇」挑一個";
    }
  });

  $("stationMsg").addEventListener("click", function(e){
    var b = e.target.closest("button[data-stop]"); if(!b) return;
    $("fStation").value = b.dataset.stop;
    $("fStation").dispatchEvent(new Event("input"));
  });

  /* 依路線選站：datalist 只適合已經知道站名的人，
     不熟的人需要看到「這條線上有哪些站、順序長怎樣」 */
  var pickerOpen = false, pickedLine = null;
  $("btnLines").onclick = function(){
    pickerOpen = !pickerOpen;
    $("linePicker").classList.toggle("hide", !pickerOpen);
    this.textContent = pickerOpen ? "🚇 收起路線" : "🚇 依路線選擇";
    if(pickerOpen && !$("lineList").innerHTML) renderLines();
  };

  function renderLines(){
    $("lineList").innerHTML = META.lines.map(function(l){
      return '<button type="button" data-line="' + l.id + '" style="color:' + l.color + '">' +
        '<span class="dot" style="background:' + l.color + '"></span>' +
        esc(l.name) + '</button>';
    }).join("");
  }

  $("lineList").addEventListener("click", function(e){
    var b = e.target.closest("button"); if(!b) return;
    pickedLine = b.dataset.line;
    this.querySelectorAll("button").forEach(function(x){ x.classList.remove("on"); });
    b.classList.add("on");
    var line = META.lines.find(function(l){ return l.id === pickedLine; });
    $("stopList").innerHTML = '<div class="seq">' + esc(line.name) + '　' +
      esc(line.stations[0]) + " → " + esc(line.stations[line.stations.length - 1]) + "</div>" +
      line.stations.map(function(st){
        return '<button type="button" data-stop="' + esc(st) + '">' + esc(st) + "</button>";
      }).join("");
  });

  $("stopList").addEventListener("click", function(e){
    var b = e.target.closest("button[data-stop]"); if(!b) return;
    $("fStation").value = b.dataset.stop;
    $("fStation").dispatchEvent(new Event("input"));
    pickerOpen = false;
    $("linePicker").classList.add("hide");
    $("btnLines").textContent = "🚇 依路線選擇";
  });

  $("btnSubmit").onclick = submitMe;
  $("btnEdit").onclick = function(){ EDITING = true; render(); };
  $("btnGen").onclick = generate;

  $("btnCopy").onclick = function(){
    var url = location.origin + "/r/" + ROOM.id;
    var txt = "【" + ROOM.title + "】" + ROOM.date + " " + ROOM.time + "\n填一下你的條件：" + url;
    navigator.clipboard.writeText(txt).then(
      function(){ toast("邀請訊息已複製，貼到群組就行"); },
      function(){ toast("複製失敗，請手動複製網址列"); }
    );
  };
  /* 飯局名稱與時間可以事後改 —— 時間常常會喬 */
  $("btnEditRoom").onclick = function(){
    $("roomView").classList.add("hide");
    $("roomEdit").classList.remove("hide");
    $("eTitle").value = ROOM.title;
    $("eDate").value = ROOM.date;
    $("eTime").value = ROOM.time;
    $("eTitle").focus();
  };
  $("btnCancelRoom").onclick = function(){
    $("roomEdit").classList.add("hide");
    $("roomView").classList.remove("hide");
  };
  $("btnSaveRoom").onclick = async function(){
    this.disabled = true;
    try{
      ROOM = await api("PUT", "/rooms/" + ROOM.id, {
        title: $("eTitle").value, date: $("eDate").value, time: $("eTime").value
      });
      $("roomEdit").classList.add("hide");
      $("roomView").classList.remove("hide");
      render();
      toast("已更新，其他人的畫面也會跟著變");
    }catch(e){ toast(e.message); }
    this.disabled = false;
  };

  $("btnHome").onclick = function(){
    history.pushState({}, "", "/");
    clearInterval(POLL); POLL = null;
    $("viewRoom").classList.add("hide");
    $("viewHome").classList.remove("hide");
  };

  window.addEventListener("popstate", function(){
    var rid = roomIdFromUrl();
    if(rid) openRoom(rid);
    else $("btnHome").click();
  });
}

async function submitMe(){
  showErr("");
  var payload = {
    name: $("fName").value,
    station: $("fStation").value,
    maxStations: sel.dist,
    types: sel.types
  };
  if(!payload.name.trim()) return showErr("請填暱稱");
  if(!payload.station.trim()) return showErr("請選擇你所在的捷運站");
  if(!payload.types.length) return showErr("至少選一種今天想吃的");

  var btn = $("btnSubmit");
  btn.disabled = true;
  try{
    var out = MY_ID
      ? await api("PUT", "/rooms/" + ROOM.id + "/members/" + MY_ID, payload)
      : await api("POST", "/rooms/" + ROOM.id + "/members", payload);
    MY_ID = out.memberId;
    MY_SECRET = out.secret || MY_SECRET;
    if(window.__MOCK_API__){                    // 預覽版才需要：記住每個人的 secret 好切換身分
      window.__secrets = window.__secrets || {};
      window.__secrets[MY_ID] = MY_SECRET;
    }
    lsSet("mealvote:" + ROOM.id, MY_ID);
    lsSet("mealvote:s:" + ROOM.id, MY_SECRET);
    ROOM = out.room;
    EDITING = false;
    render();
    toast("已送出，等其他人填完就可以產生推薦");
  }catch(e){ showErr(e.message); }
  btn.disabled = false;
}

async function generate(){
  var btn = $("btnGen");
  btn.disabled = true; btn.textContent = "配對中…";
  try{
    ROOM = await api("POST", "/rooms/" + ROOM.id + "/generate");
    await loadMe();          // 角色是這一刻才發的，要重新拿
    render();
    setTimeout(function(){
      var el = $("results");
      if(el) el.scrollIntoView({ behavior: "smooth", block: "start" });
    }, 80);
  }catch(e){ showErr(e.message); }
  btn.disabled = false; btn.textContent = "產生餐廳推薦";
}

/* ---------- 角色與投票 ---------- */

/** 拿自己的角色與投票狀態。角色是私密的，只有帶著 secret 才查得到。 */
async function loadMe(){
  MY_ROLE = null; MY_BALLOT = null;
  if(!MY_SECRET || !ROOM || ROOM.stage === "collecting") return;
  try{
    const me = await api("GET", "/rooms/" + ROOM.id + "/me?secret=" + encodeURIComponent(MY_SECRET));
    MY_ROLE = me.role;
    MY_BALLOT = me.ballot;
    if(MY_BALLOT && MY_BALLOT.picks && MY_BALLOT.picks.length) PICKS = MY_BALLOT.picks.slice();
    if(MY_BALLOT && MY_BALLOT.swap) SWAP = MY_BALLOT.swap.slice();
    // 重整頁面之後，把「當時押了彩蛋」這件事撿回來（10 秒不會因為重整而重來一次）
    if(!(MY_BALLOT && MY_BALLOT.submittedAt) && mysteryChoice() === "bet" && PICKS.indexOf("mystery") < 0){
      PICKS.push("mystery");
    }
  }catch(e){ /* 沒填過條件的人查不到，正常 */ }
}

function togglePick(rid){
  if(MY_BALLOT && MY_BALLOT.submittedAt) return;
  const i = PICKS.indexOf(rid);
  if(i >= 0) PICKS.splice(i, 1); else PICKS.push(rid);
  render();
}

function toggleSwap(rid){
  if(MY_BALLOT && MY_BALLOT.submittedAt) return;
  const i = SWAP.indexOf(rid);
  if(i >= 0) SWAP.splice(i, 1);
  else{
    if(SWAP.length >= 2) SWAP.shift();
    SWAP.push(rid);
  }
  render();
}

async function submitBallot(){
  if(!PICKS.length) return toast("至少要選一家");
  if(MY_ROLE && MY_ROLE.id === "wizard" && SWAP.length !== 2){
    return toast("魔法師還要指定兩家來交換票數");
  }
  const btn = $("btnBallot");
  if(btn) btn.disabled = true;
  try{
    const out = await api("POST", "/rooms/" + ROOM.id + "/ballot", {
      secret: MY_SECRET, picks: PICKS, swap: SWAP.length === 2 ? SWAP : undefined
    });
    ROOM = out.room;
    await loadMe();
    render();
    if(out.poisoned) showModal(poisonedModal());
    else toast("已送出，結果等大家投完才會揭曉");
  }catch(e){ toast(e.message); }
  if(btn) btn.disabled = false;
}

/** 笨蛋的轉盤：結果由伺服器決定，前端只負責把指針轉到那一格 */
async function spinWheel(){
  const btn = $("btnSpin");
  if(btn) btn.disabled = true;
  try{
    const out = await api("POST", "/rooms/" + ROOM.id + "/spin", { secret: MY_SECRET });
    const seg = 360 / out.total;
    // 多轉五圈再停在目標格的正中間，看起來才像真的在轉
    const target = 360 * 5 + (360 - (out.index * seg + seg / 2));
    const wheel = $("wheel");
    if(wheel){
      wheel.style.transition = "transform 4.2s cubic-bezier(.17,.67,.16,1)";
      wheel.style.transform = "rotate(" + target + "deg)";
    }
    setTimeout(async function(){
      ROOM = out.room;
      await loadMe();
      render();
      if(out.poisoned) showModal(poisonedModal());
    }, 4500);
  }catch(e){ toast(e.message); if(btn) btn.disabled = false; }
}

async function revealNow(){
  if(!confirm("還有人沒投票，確定要直接結算嗎？沒投的人就不算了。")) return;
  try{
    ROOM = await api("POST", "/rooms/" + ROOM.id + "/reveal");
    await loadMe();
    render();
  }catch(e){ toast(e.message); }
}

/** 再玩一局：清掉票、重抽角色、重抽彩蛋，條件保留 */
async function reopenGame(){
  if(!confirm("再玩一局？票數會歸零，角色與神秘店家都會重抽。大家填的條件會留著。")) return;
  try{
    ROOM = await api("POST", "/rooms/" + ROOM.id + "/reopen");
    SEEN_ROLE = false; SEEN_MYSTERY = false;
    PICKS = []; SWAP = []; MY_BALLOT = null; MY_ROLE = null;
    await loadMe();
    render();
    toast("角色重抽了，按「產生餐廳推薦」開始新的一局");
  }catch(e){ toast(e.message); }
}

/* ---------- 彈窗 ---------- */
function showModal(html){
  var el = $("modal");
  el.innerHTML = '<div class="mbox">' + html + "</div>";
  el.classList.add("on");
}
function closeModal(){ $("modal").classList.remove("on"); }
window.__closeModal = closeModal;

function roleModal(r){
  return '<div class="mrole">' +
    '<div class="mtag">你抽到的角色（只有你看得到）</div>' +
    '<div class="memoji">' + r.emoji + "</div>" +
    "<h3>" + esc(r.name) + "</h3>" +
    '<p class="mpower">' + esc(r.power) + "</p>" +
    '<p class="mdetail">' + esc(r.detail) + "</p>" +
    '<button class="btn" onclick="__closeRole()">知道了</button></div>';
}
/** 關掉角色卡之後，接著把彩蛋跳出來（不用等下一次輪詢） */
function closeRoleModal(){
  closeModal();
  if(ROOM && ROOM.stage === "voting" && ROOM.mystery && !SEEN_MYSTERY){
    SEEN_MYSTERY = true;
    setTimeout(function(){ showMysteryModal(ROOM.mystery); }, 180);
  }
}
window.__closeRole = closeRoleModal;
/* ---------- 彩蛋的 10 秒視窗 ---------- */

/** 這一場、這個人對彩蛋做過的決定。存起來是為了重整頁面不能重來一次。 */
function mysteryKey(){
  // 帶上這一局的 nonce：再玩一局時彩蛋會重抽，上一局的決定不能沿用
  return "mv.myst." + (ROOM ? ROOM.id : "?") + "." + (ROOM && ROOM.gameNonce || "-") + "." + (MY_ID || "?");
}
function mysteryChoice(){ return lsGet(mysteryKey()); }          // "bet" | "missed" | null
function setMysteryChoice(v){ lsSet(mysteryKey(), v); }

function mysteryModal(m){
  const decidable = !(MY_BALLOT && MY_BALLOT.submittedAt) && !(MY_ROLE && MY_ROLE.id === "fool");
  return '<div class="mmystery">' +
    '<div class="mtag">今日主廚隱藏推薦</div>' +
    '<div class="memoji">🕵️</div>' +
    "<h3>" + esc(m.alias) + "</h3>" +
    '<p class="mtagline">「' + esc(m.tagline) + '」</p>' +
    '<p class="mdetail">不會告訴你是哪一家。' +
      (m.typeLabel ? "只透露類型是「" + esc(m.typeLabel) + "」，" : "") +
      "而且大家都到得了。結算之後才會公開是哪一家。</p>" +
    (decidable
      ? '<div class="mycd"><span class="num" id="myCd">' + MYSTERY_WINDOW + "</span> 秒內決定" +
          '<div class="mybar"><i id="myBar" style="width:100%"></i></div>' +
          '<p class="mynote">時間到就關門了，之後不能再投給它。</p></div>' +
        '<div class="myacts">' +
          '<button class="btn" onclick="__mysteryBet()">🎲 賭一把，投給它</button>' +
          '<button class="btn ghost" onclick="__mysteryPass()">算了，不冒險</button>' +
        "</div>"
      : '<p class="mynote">' +
          (MY_ROLE && MY_ROLE.id === "fool"
            ? "你是笨蛋，投給誰由轉盤決定，這一間也在轉盤之外。"
            : "你已經送出投票了，這一間只能看看。") +
        "</p><button class=\"btn\" onclick=\"__closeModal()\">知道了</button>") +
  "</div>";
}

/** 跳出彩蛋並開始倒數。時間到自動關門，之後那張卡片就不能投了。 */
function showMysteryModal(m){
  showModal(mysteryModal(m));
  stopMysteryTimer();
  if(!$("myCd")) return;                       // 沒有決定權的人不倒數

  var left = MYSTERY_WINDOW;
  MYSTERY_TIMER = setInterval(function(){
    left--;
    var n = $("myCd"), bar = $("myBar");
    if(!n){ stopMysteryTimer(); return; }      // 彈窗被別的東西蓋掉了
    n.textContent = Math.max(0, left);
    if(bar) bar.style.width = Math.max(0, left / MYSTERY_WINDOW * 100) + "%";
    if(left <= 0){
      stopMysteryTimer();
      setMysteryChoice("missed");
      closeModal();
      render();
      toast("10 秒到了，神秘店家關門了");
    }
  }, 1000);
}
function stopMysteryTimer(){
  if(MYSTERY_TIMER){ clearInterval(MYSTERY_TIMER); MYSTERY_TIMER = null; }
}

function mysteryBet(){
  stopMysteryTimer();
  setMysteryChoice("bet");
  if(PICKS.indexOf("mystery") < 0) PICKS.push("mystery");
  closeModal();
  render();
  toast("押上去了。別忘了最後還要按送出投票");
}
function mysteryPass(){
  stopMysteryTimer();
  setMysteryChoice("missed");
  const i = PICKS.indexOf("mystery");
  if(i >= 0) PICKS.splice(i, 1);
  closeModal();
  render();
}
window.__mysteryBet = mysteryBet;
window.__mysteryPass = mysteryPass;
function poisonedModal(){
  const wiz = MY_ROLE && MY_ROLE.id === "wizard";
  return '<div class="mrole poison">' +
    '<div class="memoji">🍎</div><h3>你被壞皇后毒啞了</h3>' +
    '<p class="mpower">你剛剛送出的票整張作廢，這一輪不算數。</p>' +
    '<p class="mdetail">壞皇后會毒掉「緊接在她之後送出投票」的人。你只是運氣不好，剛好排在她後面。' +
      (wiz ? "不過你指定的那兩家還是會交換 —— 毒的是嘴巴，不是魔法。" : "") + "</p>" +
    '<button class="btn" onclick="__closeModal()">' + (wiz ? "哼，還好" : "可惡") + "</button></div>";
}

/* ---------- 房間 ---------- */
async function openRoom(id){
  try{
    ROOM = await api("GET", "/rooms/" + id);
  }catch(e){
    $("viewHome").classList.remove("hide");
    toast(e.message);
    history.replaceState({}, "", "/");
    return;
  }

  MY_ID = lsGet("mealvote:" + ROOM.id);
  MY_SECRET = lsGet("mealvote:s:" + ROOM.id);
  if(MY_ID && !ROOM.members.some(function(m){ return m.id === MY_ID; })){ MY_ID = null; MY_SECRET = null; }
  await loadMe();

  $("viewHome").classList.add("hide");
  $("viewRoom").classList.remove("hide");
  render();

  clearInterval(POLL);
  POLL = setInterval(async function(){
    if(document.hidden) return;
    try{
      var fresh = await api("GET", "/rooms/" + ROOM.id);
      // 自己正在打字時不要被輪詢蓋掉畫面
      var editingRoom = !$("roomEdit").classList.contains("hide");
      if(JSON.stringify(fresh) !== JSON.stringify(ROOM) && !EDITING && !editingRoom){
        var stageChanged = fresh.stage !== ROOM.stage;
        ROOM = fresh;
        // 別人按下產生推薦時，我的角色是那一刻才發的，要去拿回來
        if(stageChanged || (!MY_ROLE && fresh.stage !== "collecting")) await loadMe();
        render();
      }
    }catch(e){ /* 網路瞬斷就跳過這一輪 */ }
  }, 3500);
}

/* ---------- 畫面 ---------- */
function render(){
  // 換了一局（有人改條件、或按了「再玩一局」）→ 角色卡與彩蛋要重新跳一次
  if(ROOM.gameNonce !== GAME_NONCE){
    GAME_NONCE = ROOM.gameNonce;
    SEEN_ROLE = false; SEEN_MYSTERY = false;
    stopMysteryTimer();
    if(!(MY_BALLOT && MY_BALLOT.submittedAt)){ PICKS = []; SWAP = []; }
  }

  $("rTitle").textContent = ROOM.title;
  var wd = ["日","一","二","三","四","五","六"][new Date(ROOM.date + "T00:00:00").getDay()];
  $("rWhen").textContent = ROOM.date + "（" + wd + "）" + ROOM.time;
  $("rCode").textContent = ROOM.id;

  var me = ROOM.members.find(function(m){ return m.id === MY_ID; });

  /* 我的條件 */
  if(me && !EDITING){
    $("meForm").classList.add("hide");
    $("meDone").classList.remove("hide");
    $("meTitle").textContent = "你的條件";
    $("meSub").textContent = "改了之後推薦會重新計算";
    $("meAv").textContent = me.name.slice(0, 1);
    $("meName").textContent = me.name;
    $("meDetail").textContent = me.station + "站 · " + distLabel(me.maxStations) +
      " · " + me.types.map(typeLabel).join("、");
  }else{
    $("meForm").classList.remove("hide");
    $("meDone").classList.add("hide");
    $("meTitle").textContent = me ? "修改你的條件" : "填寫你的條件";
    $("meSub").textContent = me ? "改完記得送出" : "三個問題，20 秒填完";
    if(me && EDITING) fillForm(me);
  }

  /* 成員列表 */
  $("mCount").textContent = ROOM.members.length ? "（" + ROOM.members.length + " 人）" : "";
  $("mList").innerHTML = ROOM.members.length
    ? ROOM.members.map(function(m){
        return '<div class="m' + (m.id === MY_ID ? " me" : "") + '">' +
          '<div class="av">' + esc(m.name.slice(0,1)) + "</div>" +
          '<div class="info"><b>' + esc(m.name) + "</b>" +
          '<div class="d">' + esc(m.station) + "站 · " + distLabel(m.maxStations) +
          " · " + m.types.map(typeLabel).join("、") + "</div></div>" +
          (m.id === MY_ID ? '<span class="tag">你</span>' : "") + "</div>";
      }).join("")
    : '<div class="blank"><div class="big">👀</div><p>還沒有人填，把連結丟到群組吧</p></div>';

  $("btnGen").disabled = ROOM.members.length === 0;
  $("btnGen").textContent = ROOM.stage === "collecting"
    ? "產生餐廳推薦" + (ROOM.members.length ? "（" + ROOM.members.length + " 人）" : "")
    : "重新產生推薦";

  renderResults();
}

function fillForm(m){
  $("fName").value = m.name;
  $("fStation").value = m.station;
  sel.dist = m.maxStations; sel.types = m.types.slice();

  $("fDist").querySelectorAll("button").forEach(function(b){
    b.classList.toggle("on", parseInt(b.dataset.v,10) === m.maxStations);
  });
  if(!$("fDist").querySelector(".on")) $("fDist").lastElementChild.classList.add("on");

  $("fTypes").querySelectorAll(".opt").forEach(function(b){
    b.classList.toggle("on", m.types.indexOf(b.dataset.t) >= 0);
  });
}

function clearForm(){
  $("fName").value = ""; $("fStation").value = ""; $("stationMsg").innerHTML = "";
  sel = { dist: 6, types: [] };
  $("fDist").querySelectorAll("button").forEach(function(b){ b.classList.toggle("on", b.dataset.v === "6"); });
  $("fTypes").querySelectorAll(".opt").forEach(function(b){ b.classList.remove("on"); });
}

function typeLabel(id){
  var t = META.types.find(function(x){ return x.id === id; });
  return t ? t.label.split("・")[0] : id;
}
function distLabel(n){ return n >= 40 ? "距離不限" : n + " 站內"; }

/* 步行時間：用不動產業界慣用的每分鐘 80 公尺換算，不足一分鐘也算一分鐘 */
function walkMins(metres){ return Math.max(1, Math.ceil(metres / 80)); }

/* ---------- 推薦結果 ---------- */
function renderResults(){
  const box = $("results");
  if(ROOM.stage === "collecting" || !ROOM.result){ box.innerHTML = ""; return; }
  box.innerHTML = (ROOM.stage === "revealed") ? revealedHtml() : votingHtml();

  // 進到投票階段時，角色卡與彩蛋各跳一次
  if(ROOM.stage === "voting"){
    if(MY_ROLE && !SEEN_ROLE){ SEEN_ROLE = true; showModal(roleModal(MY_ROLE)); return; }
    if(ROOM.mystery && !SEEN_MYSTERY && SEEN_ROLE){ SEEN_MYSTERY = true; showMysteryModal(ROOM.mystery); }
  }
}

/** 這一輪所有可以投的選項（推薦候選 + 彩蛋） */
function allOptions(){
  const res = ROOM.result;
  const list = (res.consensus || []).concat(res.byType || []);
  if(ROOM.mystery){
    if(ROOM.mystery.revealed && ROOM.mystery.entry){
      // 揭曉之後換成真面目：拿真實店家的完整資料，但 id 仍保持 "mystery"，
      // 不然對不上大家投的那一票。
      const e = ROOM.mystery.entry;
      list.push(Object.assign({}, e, {
        bucket: "mystery",
        restaurant: Object.assign({}, e.restaurant, {
          id: "mystery", mystery: true, wasAlias: ROOM.mystery.alias, tagline: ROOM.mystery.tagline
        })
      }));
    }else{
      list.push({
        bucket: "mystery", typeLabel: ROOM.mystery.typeLabel, typeEmoji: ROOM.mystery.typeEmoji,
        voters: [], ev: null,
        restaurant: { id: "mystery", name: ROOM.mystery.alias, note: ROOM.mystery.tagline,
                      station: null, price: null, mystery: true }
      });
    }
  }
  return list;
}

/* ---------- 投票中 ---------- */
function votingHtml(){
  const n = ROOM.members.length;
  const res = ROOM.result;
  const locked = !!(MY_BALLOT && MY_BALLOT.submittedAt);
  const isFool = MY_ROLE && MY_ROLE.id === "fool";
  const isWizard = MY_ROLE && MY_ROLE.id === "wizard";
  let html = "";

  /* 進度條 */
  html += '<div class="board"><div class="board-h">投票進行中' +
    "<span>" + ROOM.votedCount + " / " + n + " 人已送出</span></div>" +
    '<div class="waiting">' + ROOM.members.map(function(m){
      return '<span class="' + (m.hasVoted ? "done" : "") + '">' +
        (m.hasVoted ? "✓ " : "⏳ ") + esc(m.name) + "</span>";
    }).join("") + "</div>" +
    '<p class="hidden-note">🔒 結果會等大家都投完才揭曉，投票期間看不到任何票數。</p>' +
    (MY_ID && ROOM.votedCount > 0 && ROOM.votedCount < n
      ? '<button class="clearv" onclick="__reveal()">不等了，直接結算</button>' : "") +
    "</div>";

  /* 我的角色小卡 */
  if(MY_ROLE){
    html += '<div class="myrole" onclick="__showRole()">' +
      '<span class="e">' + MY_ROLE.emoji + "</span>" +
      "<div><b>你是「" + esc(MY_ROLE.name) + "」</b><span>" + esc(MY_ROLE.power) + "</span></div>" +
      '<span class="q">?</span></div>';
  }

  if(locked){
    html += '<div class="doneBox">' +
      (MY_BALLOT.poisoned
        ? "<b>🍎 你被壞皇后毒啞了</b><p>這一輪你的票不算數，等大家投完看結果吧。" +
          (isWizard ? "不過你指定的交換照樣會生效 —— 毒的是嘴巴，不是魔法。" : "") + "</p>"
        : "<b>✅ 你已經送出投票</b><p>投票不能反悔。等其他人投完就會自動揭曉。</p>") +
      "</div>";
  }

  /* 笨蛋的轉盤 */
  if(isFool && !locked){
    const ids = (res.consensus || []).concat(res.byType || []);
    const seg = 360 / ids.length;
    const colors = ["#e2622f","#2f9169","#c8891c","#5b8fc9","#a05fb4","#c4483a","#3fa39b","#8a8f3a"];
    const stops = ids.map(function(x, i){
      return colors[i % colors.length] + " " + (i * seg) + "deg " + ((i + 1) * seg) + "deg";
    }).join(",");
    html += '<div class="wheelbox"><h3>🤡 你是笨蛋，不能自己選</h3>' +
      "<p>按下去讓轉盤決定你投給誰。轉到哪家就是哪家，不能重來。</p>" +
      '<div class="wheelwrap"><div class="pointer">▼</div>' +
      '<div class="wheel" id="wheel" style="background:conic-gradient(' + stops + ')">' +
      ids.map(function(x, i){
        const a = i * seg + seg / 2;
        return '<span class="wl" style="transform:rotate(' + a + 'deg) translateY(-38%)">' +
          esc(x.restaurant.name.slice(0, 6)) + "</span>";
      }).join("") + "</div></div>" +
      '<button class="btn" id="btnSpin" onclick="__spin()">轉！</button></div>';
  }

  /* 魔法師的交換指定 */
  if(isWizard && !locked){
    html += '<div class="wizbox"><h3>🧙 指定兩家交換票數</h3>' +
      "<p>交換會在所有人投完之後才發生，所以你現在不知道那兩家各有幾票。閉著眼睛選吧。</p>" +
      '<div class="swaptags">' + (SWAP.length
        ? SWAP.map(function(rid){
            const o = allOptions().find(function(x){ return x.restaurant.id === rid; });
            return "<span>" + esc(o ? o.restaurant.name : rid) + "</span>";
          }).join('<em>↔</em>')
        : '<span class="ph">還沒指定，點下面卡片的「選來交換」</span>') + "</div></div>";
  }

  /* 候選卡片：維持「最多人想吃」與「每個人各自想吃的」兩區，投的是同一張票 */
  const opts = allOptions();
  const hint = isFool ? "笨蛋不能自己選，看轉盤決定。" : "可以複選，喜歡的都按下去，最後記得送出。";
  const card = function(x){ return optionCard(x, n, locked, isFool, isWizard); };

  const consensus = opts.filter(function(x){ return x.bucket === "consensus"; });
  const solo      = opts.filter(function(x){ return x.bucket !== "consensus" && x.bucket !== "mystery"; });
  const mystery   = opts.filter(function(x){ return x.bucket === "mystery"; });

  html += '<div class="sec"><div class="sec-h"><h3>🔥 最多人想吃的</h3>' +
    '<span class="cnt">' + consensus.length + " 家</span></div>" +
    '<p class="lead">' + (consensus.length
      ? "兩個人以上都選了同一個類型，依想吃的人數排。" + hint
      : "大家想吃的類型完全沒有交集，所以這一區是空的——直接從下面各自的選項裡挑吧。") + "</p>" +
    consensus.map(card).join("") + "</div>";

  if(solo.length){
    const per = res.perSoloType === 2 ? "每種挑兩家備用。" : "每種只挑一家。";
    html += '<div class="sec"><div class="sec-h"><h3>🎯 每個人各自想吃的</h3>' +
      '<span class="cnt">' + solo.length + " 家</span></div>" +
      '<p class="lead">只有一個人選的類型，' + per + "</p>" +
      solo.map(card).join("") + "</div>";
  }

  if(mystery.length){
    html += '<div class="sec"><div class="sec-h"><h3>🕵️ 今日主廚隱藏推薦</h3>' +
      '<span class="cnt">1 家</span></div>' +
      '<p class="lead">不會告訴你是哪一家，全房間看到的是同一間。要不要賭一把隨你。</p>' +
      mystery.map(card).join("") + "</div>";
  }

  if(!locked && !isFool){
    html += '<div class="sticky"><button class="btn green" id="btnBallot" onclick="__submitBallot()">' +
      "送出投票（已選 " + PICKS.length + " 家）</button></div>";
  }

  if(res.warnings && res.warnings.length){
    html += '<div class="warnbox"><b>幾件事先說一下</b><ul>' +
      res.warnings.map(function(w){ return "<li>" + esc(w) + "</li>"; }).join("") + "</ul></div>";
  }
  return html;
}

function optionCard(x, n, locked, isFool, isWizard){
  const r = x.restaurant;
  const picked = PICKS.indexOf(r.id) >= 0;
  const inSwap = SWAP.indexOf(r.id) >= 0;
  const unmasked = !!r.wasAlias;              // 揭曉後的神秘店家：已經知道是誰了
  const isMystery = !!r.mystery && !unmasked; // 還蒙著面的神秘店家

  const why = x.typeLabel
    ? x.typeEmoji + " " + esc(x.typeLabel) + (x.voters && x.voters.length ? "　" + esc(x.voters.join("、")) + " 想吃" : "")
    : "";

  let pill = "";
  if(isMystery){
    pill = '<span class="pill mys">神秘</span>';
  }else if(unmasked){
    pill = '<span class="pill mys">🕵️ 揭曉</span>';
  }else if(x.voters){
    const c = x.voters.length;
    let cls, txt;
    if(c >= n && n >= 2){ cls = "v-all"; txt = "全員 " + n + " 人都想吃"; }
    else if(c >= 4)     { cls = "v4";    txt = c + " 人想吃"; }
    else if(c === 3)    { cls = "v3";    txt = "3 人想吃"; }
    else if(c === 2)    { cls = "v2";    txt = "2 人想吃"; }
    else                { cls = "v1";    txt = "1 人想吃"; }
    pill = '<span class="pill ' + cls + '">' + txt + "</span>";
  }

  return '<div class="r' + (picked ? " picked" : "") + (isMystery || unmasked ? " mystery" : "") + '">' +
    (why ? '<div class="why">' + why + "</div>" : "") +
    (unmasked ? '<div class="unmask">' + esc(r.wasAlias) + " 其實是 👇</div>" : "") +
    '<div class="rh"><h4>' + esc(r.name) + "</h4>" + pill + "</div>" +
    (isMystery
      ? '<p class="note">「' + esc(r.note) + '」</p><p class="note dim">今天只透露類型是「' +
        esc(x.typeLabel || "保密") + '」，而且大家都到得了。真實店名要等結算才會公開。</p>'
      : '<div class="meta"><span>🚇 ' + esc(r.station) + "站</span>" +
        (r.price ? "<span class='dot'>·</span><span>約 $" + r.price + " / 人</span>" : "") +
        (r.book ? '<span class="pill warn">建議訂位</span>' : "") + "</div>" +
        (r.dist != null ? '<div class="meta"><span class="walk">🚶 出站後約 ' + r.dist + " 公尺・走路 " + walkMins(r.dist) + " 分鐘</span></div>" : "") +
        (r.note ? '<p class="note">' + esc(r.note) + "</p>" : "") +
        '<div class="links">' +
          '<a href="' + r.mapUrl + '" target="_blank" rel="noopener">地圖・評分</a>' +
          '<a href="' + r.menuUrl + '" target="_blank" rel="noopener">看菜單</a>' +
          '<a href="' + r.bookUrl + '" target="_blank" rel="noopener">查訂位</a>' +
        "</div>") +
    // 彩蛋那張卡片永遠要說明白它現在是什麼狀態，笨蛋與已送出的人也要
    (isMystery && (locked || isFool)
      ? '<div class="pickbar"><span class="pickbtn locked' + (picked ? " on" : "") + '">' +
          (isFool ? "🤡 轉盤不含這一家"
                  : picked ? "🎲 已押注" : "⏳ 沒有押注") + "</span></div>"
      : "") +
    (locked || isFool ? "" :
      '<div class="pickbar">' +
        // 彩蛋的去留在那 10 秒的彈窗裡就決定了，這裡只顯示結果，不再給第二次機會
        (isMystery
          ? '<span class="pickbtn locked' + (picked ? " on" : "") + '">' +
              (picked ? "🎲 已押注" : mysteryChoice() ? "⏳ 已錯過，不能再投" : "⏳ 等你決定…") + "</span>"
          : '<button class="pickbtn' + (picked ? " on" : "") + '" onclick="__pick(\'' + r.id + '\')">' +
              (picked ? "✓ 已選" : "＋ 選這家") + "</button>") +
        (isWizard ? '<button class="swapbtn' + (inSwap ? " on" : "") + '" onclick="__swap(\'' + r.id + '\')">' +
          (inSwap ? "🧙 交換中" : "選來交換") + "</button>" : "") +
      "</div>") +
  "</div>";
}

/* ---------- 揭曉 ---------- */
function revealedHtml(){
  const f = ROOM.final;
  const opts = allOptions();
  const nameOf = function(rid){
    const o = opts.find(function(x){ return x.restaurant.id === rid; });
    return o ? o.restaurant.name : rid;
  };
  let html = "";

  const top = f.ranked.filter(function(x){ return x.rank <= 3; }).slice(0, 5);
  const medal = ["🥇", "🥈", "🥉"];

  html += '<div class="board reveal"><div class="board-h">最終結果' +
    "<span>已套用角色技能</span></div>" +
    (top.length ? top.map(function(x){
      const max = f.ranked[0].votes || 1;
      return '<div class="row' + (x.rank === 1 ? " lead" : "") + '">' +
        '<span class="medal">' + (medal[x.rank - 1] || "") + "</span>" +
        '<div class="info"><b>' + esc(nameOf(x.id)) + (x.id === "mystery" ? " 🕵️" : "") + "</b>" +
          '<span class="sub">' + esc(x.voters.join("、") || "—") + "</span>" +
          '<span class="bar"><i style="width:' + Math.round(x.votes / max * 100) + '%"></i></span>' +
        "</div>" +
        '<span class="cnt">' + x.votes + ' <em>票</em></span>' +
      "</div>";
    }).join("") : '<p class="hidden-note">沒有人投票。</p>') +
    "</div>";

  /* 技能結算說明 */
  let fx = "";
  const wizRole = (f.roles || []).find(function(r){ return r.role === "wizard"; });
  if(f.swap){
    fx += "<li>🧙 魔法師把「" + esc(nameOf(f.swap.a)) + "」與「" + esc(nameOf(f.swap.b)) + "」的票數對調了" +
      (wizRole && wizRole.poisoned ? "（他被毒啞了，但交換照樣生效）" : "") + "</li>";
  }
  if(f.poisoned && f.poisoned.length) fx += "<li>🍎 " + esc(f.poisoned.join("、")) + " 被壞皇后毒啞，票不算數</li>";
  const king = (f.roles || []).find(function(r){ return r.role === "king"; });
  if(king) fx += "<li>👑 " + esc(king.name) + " 是國王，每一票都算兩票</li>";
  const fool = (f.roles || []).find(function(r){ return r.role === "fool"; });
  if(fool) fx += "<li>🤡 " + esc(fool.name) + " 是笨蛋，那一票是轉盤轉出來的</li>";
  if(fx) html += '<div class="warnbox"><b>這一局發生了什麼</b><ul>' + fx + "</ul></div>";

  /* 角色揭曉 */
  html += '<div class="board"><div class="board-h">角色揭曉<span>現在可以說了</span></div>' +
    '<div class="rolelist">' + (f.roles || []).map(function(r){
      return '<span><b>' + r.emoji + "</b> " + esc(r.name) + "　" + esc(r.roleName) +
        (r.poisoned ? " 😵" : "") + "</span>";
    }).join("") + "</div></div>";

  if(ROOM.mystery){
    const my = opts.find(function(x){ return x.restaurant.id === "mystery"; });
    const hit = f.ranked.find(function(y){ return y.id === "mystery"; });
    const got = hit ? hit.votes : 0;
    html += '<div class="unmaskbox"><b>🕵️ 神秘店家的真面目</b>' +
      '<p class="alias">' + esc(ROOM.mystery.alias) + " 其實是——</p>" +
      (my && !my.restaurant.wasAlias
        ? '<p class="real">（這一局沒有抽到神秘店家）</p>'
        : '<p class="real">' + esc(my ? my.restaurant.name : "?") + "</p>" +
          '<p class="sub">' + esc(ROOM.mystery.typeEmoji + " " + (ROOM.mystery.typeLabel || "")) +
            (my && my.restaurant.station ? "　🚇 " + esc(my.restaurant.station) + "站" : "") + "</p>" +
          '<p class="sub">' + (got ? "有 " + got + " 票賭了下去 —— 賭得值不值，你們自己評斷。" : "沒有人敢賭它，可惜了。") + "</p>") +
      "</div>";
  }

  html += '<div class="sticky"><button class="btn ghost" id="btnReopen" onclick="__reopen()">' +
    "🔄 再玩一局（重抽角色）</button></div>";

  html += '<div class="sec"><div class="sec-h"><h3>完整名單</h3></div>' +
    opts.map(function(x){
      const hit = f.ranked.find(function(y){ return y.id === x.restaurant.id; });
      return optionCard(x, ROOM.members.length, true, false, false).replace("</div>",
        '<div class="votebar"><div class="tally"><span class="num">' + (hit ? hit.votes : 0) +
        '</span><span class="names">' + esc(hit && hit.voters.length ? hit.voters.join("、") : "沒有人投") +
        "</span></div></div></div>");
    }).join("") + "</div>";

  return html;
}

window.__pick = togglePick;
window.__swap = toggleSwap;
window.__submitBallot = submitBallot;
window.__spin = spinWheel;
window.__reveal = revealNow;
window.__reopen = reopenGame;
window.__showRole = function(){ if(MY_ROLE) showModal(roleModal(MY_ROLE)); };

/* 預覽版專用掛勾。正式版沒有 __MOCK_API__，這段等於不存在。 */
if(window.__MOCK_API__){
  window.__preview = {
    open: openRoom,
    newMember: function(){
      MY_ID = null; MY_SECRET = null; MY_ROLE = null; MY_BALLOT = null;
      PICKS = []; SWAP = []; SEEN_ROLE = false; SEEN_MYSTERY = false;
      EDITING = false; clearForm(); render();
    },
    setMember: async function(id){
      MY_ID = id;
      MY_SECRET = (window.__secrets || {})[id] || null;
      MY_ROLE = null; MY_BALLOT = null; PICKS = []; SWAP = [];
      SEEN_ROLE = false; SEEN_MYSTERY = false; EDITING = false;
      await loadMe();
      render();
    },
    reload: function(){ return openRoom(ROOM ? ROOM.id : "DEMO01"); }
  };
}

boot();
})();

</script>
<script>

/* 預覽版的操作列。正式版沒有這一段。 */
var DEMO = [
  { name:"小明", station:"市政府", maxStations:6,  types:["japanese","bbq"] },
  { name:"小華", station:"公館",   maxStations:10, types:["hotpot","ramen"] },
  { name:"小美", station:"中山",   maxStations:4,  types:["korean","hotpot"] }
];

function pvNote(){
  var el = document.querySelector(".pvnote");
  if(el) return;
  var n = document.createElement("div");
  n.className = "pvnote";
  n.innerHTML = "這是<b>預覽版</b>：畫面、餐廳資料與推薦演算法都跟正式版完全相同，" +
    "但後端換成了瀏覽器內的模擬，所以「每個人在自己手機上填」「即時同步」看不出來，" +
    "重新整理也會清空。用上面的按鈕就能在同一個畫面加好幾個人、試投票。";
  var bar = document.querySelector(".pvbar");
  bar.parentNode.insertBefore(n, bar.nextSibling);
}

async function pvDemo(){
  for(var i = 0; i < DEMO.length; i++){
    var d = DEMO[i];
    await window.__MOCK_API__("POST", "/rooms/DEMO01/members", d);
  }
  await window.__preview.reload();
  var ms = await window.__MOCK_API__("GET", "/rooms/DEMO01");
  if(ms.members.length) window.__preview.setMember(ms.members[0].id);
  await pvWho();
}
function pvNew(){ window.__preview.newMember(); pvWho(); window.scrollTo({ top:0, behavior:"smooth" }); }
/* 表單送出後身分列也要跟著更新 */
document.addEventListener("click", function(e){
  if(e.target && e.target.id === "btnSubmit") setTimeout(pvWho, 400);
});
async function pvReset(){
  await window.__MOCK_API__("POST", "/rooms", { title:"週五下班聚餐", date:document.getElementById("hDate").value, time:"19:30" });
  window.__preview.newMember();
  await window.__preview.reload();
  await pvWho();
}
async function pvSwitch(){
  var r = await window.__MOCK_API__("GET", "/rooms/DEMO01");
  if(!r.members.length) return alert("還沒有人填寫");
  var names = r.members.map(function(m,i){ return (i+1) + ". " + m.name; }).join("\n");
  var pick = prompt("要用誰的身分看畫面？輸入編號：\n" + names + "\n（0 = 都不是，當成新來的人）", "1");
  if(pick === null) return;
  var i = parseInt(pick, 10);
  if(i === 0) window.__preview.newMember();
  else if(r.members[i-1]) window.__preview.setMember(r.members[i-1].id);
  await pvWho();
}
async function pvWho(){
  var r = await window.__MOCK_API__("GET", "/rooms/DEMO01");
  var me = document.querySelector(".m.me b");
  document.getElementById("pvWho").textContent =
    "目前身分：" + (me ? me.textContent : "新來的人") + "　·　房內 " + r.members.length + " 人";
}

/* 直接進到房間，不用先經過首頁 */
setTimeout(async function(){
  pvNote();
  await window.__preview.open("DEMO01");
  document.getElementById("viewHome").classList.add("hide");
  pvWho();
}, 120);

</script>
